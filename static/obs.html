<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch TTS - Steam 2004 OBS Browser Overlay</title>
    <link rel="stylesheet" href="obs.css">
</head>
<body class="obs-body">
    <!-- Audio Element -->
    <audio id="obsAudioPlayer" preload="auto"></audio>

    <!-- Floating Compact Vertical Steam 2004 OBS Stream Overlay -->
    <div id="obsOverlayCard" class="obs-card idle">
        <!-- Steam Window Titlebar -->
        <div class="obs-header">
            <div class="obs-live-tag">
                <span class="pulse-dot"></span>
                <span id="obsLiveText">STEAM TTS</span>
            </div>
            <div class="obs-meta">
                <span class="obs-pill" id="obsVoiceTag">VOICE: DEFAULT</span>
                <span class="obs-pill" id="obsChunkTag">READY</span>
            </div>
        </div>

        <!-- Vertical Speaker & Spoken Text Body -->
        <div class="obs-body-content">
            <div class="obs-speaker-row">
                <div class="obs-avatar" id="obsAvatar">TTS</div>
                <div class="obs-speaker-name" id="obsSpeaker">Waiting for TTS...</div>
            </div>
            <div class="obs-spoken-text" id="obsText">Twitch TTS Voice Overlay ready.</div>
        </div>

        <!-- Retro Visualizer Bar -->
        <div class="obs-visualizer-bar">
            <canvas id="obsCanvas" width="220" height="16" class="obs-canvas"></canvas>
            <div id="obsEqualizer" class="obs-eq-bars">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <script src="obs.js"></script>
</body>
</html>
